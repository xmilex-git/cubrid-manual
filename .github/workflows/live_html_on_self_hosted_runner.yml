name: Make Live HTML on self_hosted_runner Branch Push

on:
  push:
    branches:
      - self_hosted_runner
  workflow_dispatch:

jobs:
  clone-repo:
    runs-on: [self-hosted, cubrid_dev4_32_ilhansong]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          
      - name: Repository Info
        run: |
          echo "레포지토리를 성공적으로 클론했습니다"
          echo "현재 경로: $(pwd)"
          echo "레포지토리 내용: $(ls -la)"
          echo "Git 브랜치: $(git branch --show-current)"
          echo "Git 커밋: $(git log -1 --pretty=format:'%h - %s (%an, %ad)')"
          
      - name: Kill Previous Process
        run: |
          if pgrep -f "make livehtml"; then
            echo "이전 livehtml 프로세스 종료 중..."
            pkill -f "make livehtml" || true
            sleep 3 # 프로세스가 완전히 종료되길 기다림
          fi
          
      - name: Build HTML Documentation
        run: |
          if [ -f "Makefile" ] && grep -q "html:" Makefile; then
            echo "cubrid-manual 폴더에서 make html 실행 중..."
            make html
          else
            echo "Makefile을 찾을 수 없거나 올바른 형식이 아닙니다."
            exit 1
          fi
          
      - name: Run Live HTML Server
        run: |
          if [ -d "ko" ]; then
            cd ko
            echo "ko 폴더에서 make livehtml 실행 중..."
            nohup make livehtml > livehtml.log 2>&1 &
            echo "LiveHTML 서버 시작됨. PID: $!"
            sleep 5
            tail -n 20 livehtml.log
          else
            echo "ko 폴더를 찾을 수 없습니다."
            exit 1
          fi 

