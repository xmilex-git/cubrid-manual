name: Make Live HTML on self_hosted_runner Branch Push

on:
  push:
    branches:
      - self_hosted_runner
  workflow_dispatch:

jobs:
  clone-repo:
    runs-on: [self-hosted, 32]
    steps:
      - name: Update Repository
        run: |
          # GitHub 작업 디렉토리 경로 출력
          echo "현재 작업 디렉토리: $GITHUB_WORKSPACE"
          
          # 레포지토리 디렉토리 설정
          REPO_DIR="$GITHUB_WORKSPACE/repo/cubrid-manual"
          
          # 레포지토리가 이미 존재하는지 확인
          if [ -d "$REPO_DIR/.git" ]; then
            echo "기존 레포지토리가 있습니다. 최신 변경사항을 가져옵니다..."
            cd "$REPO_DIR"
            git fetch --all
            git checkout self_hosted_runner
            git reset --hard origin/self_hosted_runner
            echo "레포지토리가 성공적으로 업데이트 되었습니다."
          else
            echo "레포지토리가 존재하지 않습니다. 새로 클론합니다..."
            # 부모 디렉토리가 있는지 확인하고 없으면 생성
            mkdir -p "$(dirname "$REPO_DIR")"
            # 기존 디렉토리가 있다면 삭제
            if [ -d "$REPO_DIR" ]; then
              rm -rf "$REPO_DIR"
            fi
            # 레포지토리 클론
            git clone --branch self_hosted_runner --depth 1 https://github.com/CUBRID/cubrid-manual.git "$REPO_DIR"
          fi
          
          echo "REPO_DIR=$REPO_DIR" >> $GITHUB_ENV
          
      - name: Repository Info
        run: |
          cd $REPO_DIR
          echo "레포지토리를 성공적으로 클론했습니다"
          echo "현재 경로: $(pwd)"
          echo "레포지토리 내용: $(ls -la)"
          echo "Git 브랜치: $(git branch --show-current)"
          echo "Git 커밋: $(git log -1 --pretty=format:'%h - %s (%an, %ad)')"
          
      - name: Kill Previous Process
        run: |
          if pgrep -f "make livehtml"; then
            echo "이전 livehtml 프로세스 종료 중..."
            pkill -f "make livehtml" || true
            sleep 3 # 프로세스가 완전히 종료되길 기다림
          fi
          
      - name: Build HTML Documentation
        run: |
          cd $REPO_DIR
          if [ -f "Makefile" ] && grep -q "html:" Makefile; then
            echo "cubrid-manual 폴더에서 make html 실행 중..."
            make html
          else
            echo "Makefile을 찾을 수 없거나 올바른 형식이 아닙니다."
            exit 1
          fi
          
      - name: Run Live HTML Server
        run: |
          cd $REPO_DIR
          if [ -d "ko" ]; then
            cd ko
            echo "ko 폴더에서 make livehtml 실행 중..."
            nohup make livehtml > $GITHUB_WORKSPACE/livehtml.log 2>&1 &
            echo "LiveHTML 서버 시작됨. PID: $!"
            sleep 5
            tail -n 20 $GITHUB_WORKSPACE/livehtml.log
          else
            echo "ko 폴더를 찾을 수 없습니다."
            exit 1
          fi 

